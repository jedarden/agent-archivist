# Noncurrent-version lifecycle registry for the S3 storage profiles.
#
# The machine-readable record behind docs/notes/s3-noncurrent-lifecycle.md
# ("The retention matrix"): one rule per profile and prefix family, the
# prefix families with their source-of-truth class, and the profile shapes
# the rules sit inside. The gate that keeps the registry, the note's
# matrix table, the control-records registry's write classes, the audit's
# guidance constant, and the MinIO reference provisioning script agreeing
# is tools/check-s3-lifecycle.py (DoD fast lane).
#
# Rule grammar (closed set):
#   expire-noncurrent           age out noncurrent copies after `days`;
#                               the current version is out of reach (L-001)
#   retain-noncurrent           never expire — the noncurrent copies are
#                               unique history (L-002); no `days`
#   expire-objects              expire whole objects, current included;
#                               legal only for a family with
#                               source_of_truth = false (L-003)
#   not-applicable              the profile's shape has no such versions;
#                               requires `reason`
#   abort-incomplete-multipart  bucket-wide session reaping at `days`
#                               (L-004); family "all"
#
# This file records configuration shape and citations only — never
# endpoints, bucket names, credentials, or tenant identifiers (SP-006).

schema = "archivist.s3-lifecycle/v1"
note = "docs/notes/s3-noncurrent-lifecycle.md"
# Must equal NONCURRENT_VERSION_GUIDANCE in
# crates/archivist-storage/src/lifecycle_audit.rs — the citation every
# noncurrent-version audit line renders.
guidance_id = "sto-009-noncurrent-version-expiration"

# The plan Section 7.5 tenant tree's prefix families. `source_of_truth`
# marks the families whose CURRENT versions are the archive's claim about
# the key and are never a lifecycle target (L-001); `overwrite` is the
# family's write shape — "convergent" overwrites rewrite the same
# canonical bytes, so a noncurrent copy is redundant; "epoch-replacement"
# overwrites carry different bytes (a higher signed epoch), so the
# noncurrent copy is the previous trust state's only copy at that key.
# `subprefixes` names the tenant-tree segments the family covers
# ("control/<segment>" for the control families); the gate proves they
# partition the tree with no overlap and match the control-records
# registry's write classes exactly.
[[family]]
id = "raw"
purpose = "content-addressed blobs, occurrence manifests, upload attestations"
source_of_truth = true
overwrite = "convergent"
subprefixes = ["raw"]

[[family]]
id = "control-current-pointer"
purpose = "current-pointer signed trust records"
source_of_truth = true
overwrite = "epoch-replacement"
subprefixes = ["control/clients", "control/delegations"]

[[family]]
id = "control-immutable"
purpose = "immutable epoch-addressed trust records"
source_of_truth = true
overwrite = "convergent"
subprefixes = [
  "control/revocations",
  "control/rotations",
  "control/receipt-keys",
  "control/authority-rotations",
  "control/retention",
]

[[family]]
id = "catalog"
purpose = "catalog checkpoints — deterministic rebuild output"
source_of_truth = false
overwrite = "convergent"
subprefixes = ["catalog"]

[[family]]
id = "derived"
purpose = "derived projections — pipeline-versioned rebuild output"
source_of_truth = false
overwrite = "convergent"
subprefixes = ["derived"]

[[family]]
id = "probe"
purpose = "the reserved probe/<label> namespace — synthetic, content-free capability-probe writes outside the four tenant prefixes"
source_of_truth = false
overwrite = "convergent"
subprefixes = ["probe"]

# The profiles the matrix speaks about. `versioning` is the shape the
# profile's qualification reports: "enabled" everywhere, "raw-bucket-only"
# for the reference shape.
[profiles.minio]
class = "reference"
versioning = "raw-bucket-only"
note = "docs/notes/minio-reference-profile.md"

[profiles.backblaze-b2]
class = "target"
versioning = "enabled"
note = "docs/notes/b2-storage-qualification.md"

[profiles.armor]
class = "target"
versioning = "enabled"
note = "docs/notes/armor-storage-qualification.md"

# The retention matrix, one rule per (profile, family). This list, the
# note's matrix table, and the gate's derived expectations must agree
# exactly; `days` is present exactly for the actions that take one.
[[rule]]
profile = "minio"
family = "raw"
action = "expire-noncurrent"
days = 30

[[rule]]
profile = "minio"
family = "control-current-pointer"
action = "not-applicable"
reason = "the control bucket carries no versioning in the reference shape"

[[rule]]
profile = "minio"
family = "control-immutable"
action = "not-applicable"
reason = "the control bucket carries no versioning in the reference shape"

[[rule]]
profile = "minio"
family = "catalog"
action = "not-applicable"
reason = "no catalog namespace in the verified reference shape"

[[rule]]
profile = "minio"
family = "derived"
action = "not-applicable"
reason = "no derived namespace in the verified reference shape"

[[rule]]
profile = "minio"
family = "probe"
action = "not-applicable"
reason = "the provisioning script removes its probes in an epilogue, not by a rule"

[[rule]]
profile = "backblaze-b2"
family = "raw"
action = "expire-noncurrent"
days = 30

[[rule]]
profile = "backblaze-b2"
family = "control-current-pointer"
action = "retain-noncurrent"

[[rule]]
profile = "backblaze-b2"
family = "control-immutable"
action = "expire-noncurrent"
days = 30

[[rule]]
profile = "backblaze-b2"
family = "catalog"
action = "expire-noncurrent"
days = 7

[[rule]]
profile = "backblaze-b2"
family = "derived"
action = "expire-noncurrent"
days = 7

[[rule]]
profile = "backblaze-b2"
family = "probe"
action = "expire-objects"
days = 1

[[rule]]
profile = "armor"
family = "raw"
action = "expire-noncurrent"
days = 30

[[rule]]
profile = "armor"
family = "control-current-pointer"
action = "retain-noncurrent"

[[rule]]
profile = "armor"
family = "control-immutable"
action = "expire-noncurrent"
days = 30

[[rule]]
profile = "armor"
family = "catalog"
action = "expire-noncurrent"
days = 7

[[rule]]
profile = "armor"
family = "derived"
action = "expire-noncurrent"
days = 7

[[rule]]
profile = "armor"
family = "probe"
action = "expire-objects"
days = 1

# The bucket-wide multipart backstop: one row under the reserved "all"
# profile scope and the reserved "multipart" family scope, not per
# profile (L-004).
[[rule]]
profile = "all"
family = "multipart"
action = "abort-incomplete-multipart"
days = 1
