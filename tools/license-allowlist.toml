# Reviewed third-party dependency licenses for Agent Archivist.
#
# One entry per third-party package that appears in Cargo.lock, recording the
# SPDX license identifier published for that crate at the time it was adopted.
# `tools/check-licenses.py` fails when a lockfile package has no entry (an
# unreviewed dependency) or when an entry outlives its dependency (a stale
# record), so adding a dependency is always a deliberate license review.
#
# The table grows only when a crate adopts an external dependency, and each
# entry lands in the same commit as the adoption. The first external crate is
# `rusqlite` (2026-09-13): the bundled SQLite engine behind the client state
# database (plan Section 7.9), which brings its build and utility crates. The
# second is the `axum`/`tokio` server stack (2026-09-13): the pinned HTTP
# server and the runtime behind `archivist-server` (plan Sections 6 and 8
# Phase 4), which bring the hyper/tower/futures HTTP stack with them. Each
# expression below is the one published for the version pinned in Cargo.lock.

[approved]
# crate-name = "SPDX identifier as published by the crate"
atomic-waker = "Apache-2.0 OR MIT"
axum = "MIT"
axum-core = "MIT"
bitflags = "MIT OR Apache-2.0"
bytes = "MIT"
cc = "MIT OR Apache-2.0"
errno = "MIT OR Apache-2.0"
fallible-iterator = "MIT/Apache-2.0"
fallible-streaming-iterator = "MIT/Apache-2.0"
find-msvc-tools = "MIT OR Apache-2.0"
futures-channel = "MIT OR Apache-2.0"
futures-core = "MIT OR Apache-2.0"
futures-task = "MIT OR Apache-2.0"
futures-util = "MIT OR Apache-2.0"
http = "MIT OR Apache-2.0"
http-body = "MIT"
http-body-util = "MIT"
httparse = "MIT OR Apache-2.0"
httpdate = "MIT OR Apache-2.0"
hyper = "MIT"
hyper-util = "MIT"
itoa = "MIT OR Apache-2.0"
libc = "MIT OR Apache-2.0"
libsqlite3-sys = "MIT"
matchit = "MIT AND BSD-3-Clause"
memchr = "Unlicense OR MIT"
mime = "MIT OR Apache-2.0"
mio = "MIT"
percent-encoding = "MIT OR Apache-2.0"
pin-project-lite = "Apache-2.0 OR MIT"
pkg-config = "MIT OR Apache-2.0"
proc-macro2 = "MIT OR Apache-2.0"
quote = "MIT OR Apache-2.0"
rusqlite = "MIT"
serde_core = "MIT OR Apache-2.0"
serde_derive = "MIT OR Apache-2.0"
shlex = "MIT OR Apache-2.0"
signal-hook-registry = "MIT OR Apache-2.0"
slab = "MIT"
smallvec = "MIT OR Apache-2.0"
socket2 = "MIT OR Apache-2.0"
syn = "MIT OR Apache-2.0"
sync_wrapper = "Apache-2.0"
tokio = "MIT"
tokio-macros = "MIT"
tower = "MIT"
tower-layer = "MIT"
tower-service = "MIT"
unicode-ident = "(MIT OR Apache-2.0) AND Unicode-3.0"
vcpkg = "MIT/Apache-2.0"
wasi = "Apache-2.0 WITH LLVM-exception OR Apache-2.0 OR MIT"
windows-link = "MIT OR Apache-2.0"
windows-sys = "MIT OR Apache-2.0"
