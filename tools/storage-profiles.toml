# Machine-readable storage-profile registry for Agent Archivist.
#
# The normative conventions live in docs/notes/storage-profiles.md; this file
# is the qualification record they define, and tools/check-storage-profiles.py
# (fast lane of scripts/definition-of-done.sh) rejects any entry that violates
# them.
#
# Nothing here claims a capability by implication. A record states what one
# compatibility run observed, or why it failed; an unknown result is never
# strengthened into a guarantee (plan Section 10). The reference profile
# carries no record because its suite lane runs in project verification.
# Target profiles may carry only explicitly marked `evidence = "live"` records:
# the synthetic target lane is a prerequisite, while the release gate consumes
# the redacted live result. Community profiles are qualified only by the
# records below.
#
# Records are append-only. A record is never edited or deleted, only
# superseded by a newer record on the same profile; a profile's standing is
# its latest record. Entries MUST NOT contain endpoints, hostnames, bucket
# names, account or tenant identifiers, or credentials (requirements PUB-002,
# SEC-010) — the gate scans for the obvious shapes of all of them.

schema = "archivist.storage-profiles/v1"

# ---------------------------------------------------------------------------
# Profiles: the named S3 implementations the documents recognize, each with
# the class docs/notes/storage-profiles.md Section 1 defines.
# ---------------------------------------------------------------------------

[profiles.minio]
class = "reference"
description = "MinIO, the local reference S3 implementation the storage compatibility suite qualifies on every full verification run (plan Section 7.7)."

[profiles.backblaze-b2]
class = "target"
description = "Backblaze B2's S3-compatible API, a target deployment profile whose isolated synthetic lane is followed by a redacted live run before each compatible release."

[profiles.armor]
class = "target"
description = "ARMOR's S3-compatible encrypted storage path, a target deployment profile qualified before deployment there."

[profiles.aws-s3]
class = "community"
description = "Amazon Web Services S3, a community profile qualified only by a recorded community run of the compatibility suite."

[profiles.garage]
class = "community"
description = "Garage, the Deuxfleurs self-hosted S3-compatible object store, a community profile qualified only by a recorded community run of the compatibility suite."

# ---------------------------------------------------------------------------
# Qualification records. These close the gap the README used to paper over
# with "expected to be usable": neither community profile has evidence, so
# both stand explicitly unqualified and excluded from the versioned release
# dispositions below until a complete community run exists. Records are
# never edited or deleted; a later release's deferral appends a new record
# and supersedes the earlier one by date.
# ---------------------------------------------------------------------------

[[records]]
profile = "aws-s3"
date = "2026-09-15"
release = "0.1.0"
outcome = "unqualified"
submitted_by = "maintainer"
reason = "Deferred for release 0.1.0: no qualification run executed. The storage compatibility suite is itself a planned Phase 2 deliverable (register verification T-OPS-006, status planned), so no suite harness exists to run; and the project's verification baseline uses no external credentials or services, so project automation holds no AWS S3 instance or credential to run it against. Qualification awaits a complete community operator run under docs/notes/storage-profiles.md Section 2."

[[records]]
profile = "garage"
date = "2026-09-15"
release = "0.1.0"
outcome = "unqualified"
submitted_by = "maintainer"
reason = "Deferred for release 0.1.0: no qualification run executed. The storage compatibility suite is itself a planned Phase 2 deliverable (register verification T-OPS-006, status planned), so no suite harness exists to run against any Garage instance, and no community run has been submitted. Qualification awaits a complete community operator run under docs/notes/storage-profiles.md Section 2."

# The 1.0.0 stable-release disposition: AWS S3 and Garage are unsupported and
# excluded from the stable release's support claims. Unlike the 0.1.0 records
# above, these were filed with the suite and the run kit in hand — the
# reference and target profiles' lanes exercise both — so the reason is no
# longer a missing harness: SP-001 puts community evidence outside project
# automation (the credential-free baseline holds no AWS S3 or Garage instance
# or credential), and no community operator run has been submitted. The
# disposition changes only when a complete kit run appends a qualified record
# (SP-009).

[[records]]
profile = "aws-s3"
date = "2026-09-27"
release = "1.0.0"
outcome = "unqualified"
submitted_by = "maintainer"
reason = "Unsupported and excluded from the 1.0.0 support claims: no qualification run executed. The storage compatibility suite and the community run kit exist (the reference and target profiles' lanes exercise them), but SP-001 puts community evidence outside project automation — the credential-free verification baseline holds no AWS S3 instance or credential — and no community operator run has been submitted. A later release changes this disposition only by citing a complete kit run per docs/notes/storage-profiles.md Section 2."

[[records]]
profile = "garage"
date = "2026-09-27"
release = "1.0.0"
outcome = "unqualified"
submitted_by = "maintainer"
reason = "Unsupported and excluded from the 1.0.0 support claims: no qualification run executed. The storage compatibility suite and the community run kit exist (the reference and target profiles' lanes exercise them), but SP-001 puts community evidence outside project automation — the credential-free verification baseline holds no Garage instance or credential — and no community operator run has been submitted against any Garage deployment. A later release changes this disposition only by citing a complete kit run per docs/notes/storage-profiles.md Section 2."

# Target release evidence is a separate, append-only record shape. This is the
# redacted live B2 run from bead aa-c4a549c6; the transcript stays with that
# bead and the registry carries only its release-safe outcome and tokens.
[[records]]
profile = "backblaze-b2"
date = "2026-09-27"
release = "0.1.0"
evidence = "live"
outcome = "qualified"
submitted_by = "maintainer"
suite_revision = "bd89a48"
operator = "maintainer"
capability = { conditional_create = "unavailable", multipart_commit_abort = "verified", stored_checksum = "provider_specific", versioning = "enabled", server_side_encryption = "verified" }

# Independent release-time live run; retained redacted transcript and cleanup
# record: docs/evidence/storage/b2-0.1.1-2026-10-07.{json,jsonl}.
[[records]]
