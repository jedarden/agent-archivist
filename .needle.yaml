bead_cli:
  backend: bead-rs

# NEEDLE validation gates. The fast lane is fmt, build, clippy, rustdoc, the
# no-placeholder stub scan, the crate graph, the license gate, and a redacted
# working-tree secret scan. The runtime gate builds the release image and
# proves zero-state bootstrap against the pinned MinIO reference profile.
gates:
  - type: command
    commands:
      - scripts/definition-of-done.sh --fast
      - SOURCE_DATE_EPOCH="$(git log -1 --format=%ct HEAD)" bash containers/agent-archivist/smoke.sh
