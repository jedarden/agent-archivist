# Agent Archivist workspace.
#
# Layout, crate boundaries, and the ownership rationale are defined in
# docs/plan/plan.md (Sections 4 and 6) and docs/notes/crate-ownership.md.
# Crate boundaries are fixed through the first vertical slice; collapsing one
# requires cycle or benchmark evidence and updates both documents in the same
# commit.

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
authors = ["jedarden <github@jedarden.com>"]
license = "Apache-2.0"
repository = "https://git.ardenone.com/jedarden/agent-archivist"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

# rustdoc runs outside clippy, so the doc baseline only holds if its own lints
# are denied in the manifest: `cargo doc --workspace --no-deps` fails the build
# on a broken intra-doc link instead of warning about it.
[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

# Shared external dependencies are pinned here as crates adopt them so every
# member resolves one version. The scaffold started dependency-free; the list
# below grows only when a crate adopts a dependency for a documented reason.

[workspace.dependencies]
# Backs the client state database (plan Section 7.9): WAL mode, explicit
# migrations, one mutator. `bundled` compiles a pinned SQLite so client state
# never depends on the host's library version; `default-features = false`
# keeps the prepared-statement cache and wasm paths out of the build. The
# OpenCode reader (plan Phase 6B) shares the pin for its read-only store
# connection.
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
# Probes the filesystem free space behind the spool directory (plan Section
# 7.9's free-space floor): `statvfs` is the one measurement the standard
# library does not expose, and rustix is the reviewed safe wrapper — the
# workspace forbids `unsafe` code, so raw `libc` bindings are not an option.
# Only the `fs` API is adopted; the default `std` feature stays on so
# `Path` implements rustix's `Arg`.
rustix = { version = "1.1.4", features = ["fs"] }
# Serves the ingestion data plane (plan Sections 6 and 8 Phase 4): axum is the
# pinned HTTP server and Tower is the middleware surface. `default-features =
# false` keeps form/query/json body machinery out — the wire contract renders
# canonical bytes through `archivist-protocol` and accepts none from the
# framework — leaving only the HTTP/1 listener and the tokio integration.
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
# Bridges the async request body into the blocking parse: `BodyExt::frame`
# is the chunk iterator the bounded async-to-blocking channel feeder pulls.
http-body-util = { version = "0.1.5", default-features = false }
# Drives the axum listener: the multi-threaded runtime, async TCP, the
# shutdown-drain timer, the signal watcher behind graceful shutdown, and the
# watch primitive the cancellation token is built on.
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "time", "signal", "sync"] }
# The `zstd-v1` storage profile's pinned encoder and decoder (plan Section
# 7.6): Zstandard level 3, single-threaded, no dictionary, content size and
# checksum enabled. `zstd-safe` is the reviewed safe-binding layer over the
# libzstd copy bundled in `zstd-sys`; the codec drives it directly rather
# than through the higher-level `zstd` wrapper because the profile is an
# exact parameter set — pledged content size, checksum flag, single-threaded
# emission, and a decoder window cap — that the wrapper does not surface.
# Every default feature stays off: `legacy` and `zdict_builder` are
# decode/training surface the profile never uses, and leaving `zstdmt` off
# builds the C library without multithreading, which is one half of what
# keeps stored bytes deterministic (the other is the single-threaded
# parameter set itself). `std` is the one feature kept on: in `zstd-sys` it
# is an empty marker, and in `zstd-safe` it gates only the Rust-side
# `Vec`-backed output-buffer bridge the codec appends through — it changes
# nothing in the C library's build, so stored bytes are unaffected. The
# version is pinned for the lifetime of the
# `zstd-v1` profile — a bump changes stored bytes and requires a new named
# profile, never a silent rewrite of `zstd-v1` (plan Section 7.5).
zstd-safe = { version = "7.3.0", default-features = false, features = ["std"] }
