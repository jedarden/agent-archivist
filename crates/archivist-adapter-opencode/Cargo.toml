[package]
name = "archivist-adapter-opencode"
description = "OpenCode source adapter: read-only allowlisted database projection"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
archivist-adapter-sdk = { path = "../archivist-adapter-sdk" }
# The OpenCode source is a SQLite database (plan Phase 6B): the reader
# opens it with the same pinned, bundled driver the client state uses, so
# one SQLite build serves both and the adapter never inherits the host's
# library version (docs/notes/crate-ownership.md rule 3 keeps the
# dependency inside this crate). The `hooks` feature adds the driver's
# authorizer callback, which the schema gate's metadata-only evidence
# uses to prove detection reads no projected column.
rusqlite = { workspace = true, features = ["hooks"] }

[lints]
workspace = true
