[package]
name = "archivist-cli"
description = "Archivist command-line entry point: collect, serve, link, admin, and status commands"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "archivist"
path = "src/main.rs"

# The end-to-end drive of `admin approve` observes the command's own
# process: the test binary re-executes itself, once per scenario, as the
# child whose stdout, stderr, and exit status are the real command's. A
# custom harness keeps that child's stdout exactly what the router wrote —
# no runner chatter between the observations.
[[test]]
name = "approve-command-end-to-end"
path = "tests/approve_command_end_to_end.rs"
harness = false

[dependencies]
archivist-adapter-claude = { path = "../archivist-adapter-claude" }
archivist-adapter-codex = { path = "../archivist-adapter-codex" }
archivist-adapter-opencode = { path = "../archivist-adapter-opencode" }
archivist-adapter-pi = { path = "../archivist-adapter-pi" }
archivist-adapter-sdk = { path = "../archivist-adapter-sdk" }
archivist-auth = { path = "../archivist-auth" }
archivist-client-core = { path = "../archivist-client-core" }
archivist-protocol = { path = "../archivist-protocol" }
archivist-server = { path = "../archivist-server" }
archivist-storage = { path = "../archivist-storage" }
archivist-storage-s3 = { path = "../archivist-storage-s3" }
bytes.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-rustls.workspace = true
hyper-util.workspace = true
# Drives the two async control-plane acts of `admin approve` — the
# authority-rotation chain fetch and the publication — over the
# administration store's backend seam; the workspace's own runtime pin,
# so the composition root adds no second async story.
tokio.workspace = true

[dev-dependencies]
# The operator tests seed real schema state — sources, spool entries —
# the read-only reports and the scheduling cycle then measure, over the
# same workspace pin the state layer itself builds on.
rusqlite.workspace = true

[lints]
workspace = true
