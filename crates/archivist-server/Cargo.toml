[package]
name = "archivist-server"
description = "Stateless, horizontally scalable Archivist HTTP ingestion data plane"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
archivist-auth = { path = "../archivist-auth" }
archivist-protocol = { path = "../archivist-protocol" }
archivist-storage = { path = "../archivist-storage" }
axum = { workspace = true }
# The serve lifecycle (crate::serve) is cancellation-aware: the shutdown
# channel is a tokio watch channel, `serve` bounds its drain with
# tokio::time, and the listener socket is handed to the runtime as a
# tokio TcpListener. The signal handlers (`shutdown_on_signal`) need the
# unix signal kind API.
tokio = { workspace = true }

[dev-dependencies]
# #[tokio::test] drives the route and lifecycle tests' socket-level HTTP
# exchanges: on top of the workspace feature set these add the attribute
# macro and the client-side async read/write extension traits the raw-TCP
# test helpers use.
tokio = { workspace = true, features = ["io-util", "macros"] }

[lints]
workspace = true
